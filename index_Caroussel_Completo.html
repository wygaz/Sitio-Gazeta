<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sítio Gazeta - Natureza ao lado do UNASP-EC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@glidejs/glide/dist/css/glide.core.min.css">
  <style>
    body {
      background-color: #eef5fa;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    nav {
      background: #f8f8f8;
      padding: 12px 24px;
      font-weight: bold;
      font-size: 18px;
      border-bottom: 1px solid #ccc;
      text-align: center;
    }

    nav a {
      margin: 0 12px;
      text-decoration: none;
      color: #333;
    }

    section {
      padding: 40px 20px;
    }

    section:nth-of-type(odd) {
      background-color: #f9f9f9;
    }

    section:nth-of-type(even) {
      background-color: #ffffff;
    }

    h2 {
      text-align: center;
      margin-bottom: 16px;
    }

    .pricing-section table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 auto;
      max-width: 900px;
    }

    .pricing-section th,
    .pricing-section td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    .pricing-section tr:nth-child(2) {
      background-color: #ffffcc;
      font-weight: bold;
    }

    .pricing-section td:nth-child(5),
    .pricing-section th:nth-child(5) {
      background-color: #ffffcc;
    }

    .reveal-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
    }

    .contact-buttons a {
      display: inline-block;
      background-color: #007bff;
      color: white;
      padding: 10px 16px;
      margin: 10px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }

    .contact-buttons span {
      display: block;
      margin-top: 4px;
      font-size: 14px;
      text-align: center;
      color: #333;
    }

    .glide__slide img {
      width: 100%;
      max-height: 600px;
      object-fit: contain;
    }

    .glide__arrows {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
      padding: 0 10px;
    }

    .glide__arrow {
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      padding: 10px;
      font-size: 18px;
      border-radius: 50%;
      cursor: pointer;
    }

    .glide__bullets {
      display: flex;
      justify-content: center;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      gap: 8px;
      z-index: 10;
    }

    .glide__bullet {
      width: 12px;
      height: 12px;
      background-color: #ccc;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }

    .glide__bullet--active {
      background-color: #333;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#localizacao">Localização</a>
    <a href="#galeria">Galeria</a>
    <a href="#video">Vídeo</a>
    <a href="#comparativo">Comparativo</a>
    <a href="#oferta">Oferta</a>
  </nav>

  <section id="galeria">
    <h2>Galeria de Imagens</h2>
    <div class="glide">
      <div class="glide__track" data-glide-el="track">
        <ul class="glide__slides">
          <li class="glide__slide"><img src="imagens/Vista_Aerea_1.png" loading="lazy" alt="Vista aérea do sítio"></li>
          <li class="glide__slide"><img src="imagens/Vista_aerea_perto.jpg" loading="lazy" alt="Vegetação"></li>
          <li class="glide__slide"><img src="imagens/Sitio_Gazeta_UNASP-EC_2.jpg" loading="lazy" alt="Proximidade do UNASP-EC"></li>
          <li class="glide__slide"><img src="imagens/Sitio_Gazeta_UNASP-EC_1.jpg" loading="lazy" alt="Proximidade do UNASP-EC"></li>
          <li class="glide__slide"><img src="imagens/Sitio_Arredores_2.jpg" loading="lazy" alt="Arredores do Sitio Gazeta"></li>
          <li class="glide__slide"><img src="imagens/Sitio_Arredores_1.jpg" loading="lazy" alt="Arredores do Sitio Gazeta"></li>
          <li class="glide__slide"><img src="imagens/Sitio_arredores_e_legendas.png" loading="lazy" alt="Arredores do Sitio Gazeta com legenda"></li>
          <li class="glide__slide"><img src="imagens/Sitio_Acesso_asfaltado_3.jpg" loading="lazy" alt="Acesso ao Sitio Gazeta asfaltado"></li>
          <li class="glide__slide"><img src="imagens/Portaria_do_UNASP-EC.png" loading="lazy" alt="Arredores do Sitio Gazeta"></li>
        </ul>
      </div>
      <div class="glide__arrows" data-glide-el="controls">
        <button class="glide__arrow glide__arrow--left" data-glide-dir="<">«</button>
        <button class="glide__arrow glide__arrow--right" data-glide-dir=">">»</button>
      </div>
      <div class="glide__bullets" data-glide-el="controls[nav]">
        <button class="glide__bullet" data-glide-dir="=0"></button>
        <button class="glide__bullet" data-glide-dir="=1"></button>
        <button class="glide__bullet" data-glide-dir="=2"></button>
        <button class="glide__bullet" data-glide-dir="=3"></button>
        <button class="glide__bullet" data-glide-dir="=4"></button>
        <button class="glide__bullet" data-glide-dir="=5"></button>
        <button class="glide__bullet" data-glide-dir="=6"></button>
        <button class="glide__bullet" data-glide-dir="=7"></button>
        <button class="glide__bullet" data-glide-dir="=8"></button>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@glidejs/glide/dist/glide.min.js"></script>
  <script>
    new Glide('.glide', {
      type: 'carousel',
      autoplay: 4000,
      hoverpause: true,
      animationDuration: 800
    }).mount();
  </script>
</body>
</html>
